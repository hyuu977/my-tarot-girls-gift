<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7d9ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarot Girls Gift">
<title>My Tarot Girls Gift</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#304071;background:#f8f7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#ffe7f4 0,transparent 25%),radial-gradient(circle at 90% 12%,#e2e8ff 0,transparent 28%),linear-gradient(180deg,#fbfaff,#f6fbff)}
button,input,textarea{font:inherit}button{cursor:pointer}header{max-width:900px;margin:auto;padding:22px 18px 8px;display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#b9c8ff,#ffcce4);display:grid;place-items:center;color:#fff;font-size:25px}header h1{margin:0;font-family:Georgia,serif;color:#5364ad;font-size:27px}header h1 small{color:#ef8fba;font-size:14px}header p{margin:3px 0;color:#8d8bad;font-size:12px}.spark{margin-left:auto;font-size:24px}
.gift{max-width:860px;margin:6px auto 16px;padding:18px;text-align:center;border:1px solid #f0d9e9;border-radius:24px;background:linear-gradient(135deg,#fff8fc,#f1f3ff);color:#b27b9d}.gift b,.gift span{display:block}.gift b{font-size:19px;color:#6675b5;margin:5px}.gift span{font-size:12px;color:#9892ae}
nav{position:sticky;top:0;z-index:10;max-width:520px;margin:0 auto 14px;display:flex;justify-content:space-around;background:#ffffffed;border:1px solid #e7e2f7;border-radius:20px;padding:7px;box-shadow:0 10px 35px #7b73a824}nav button{border:0;background:transparent;color:#9290ac;padding:8px 18px;border-radius:14px}nav button.active{color:#687be0;background:#eff1ff}main{max-width:900px;margin:auto;padding:0 16px 90px}.panel{background:#ffffffdf;border:1px solid #eeeafa;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 12px 35px #8780a91b}.hello{background:linear-gradient(135deg,#edf0ff,#fff1f7);border-radius:25px;padding:22px;margin:12px 0 16px}.hello h2{margin:5px 0}.hello p{margin:0;color:#8d8ba6}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.category-grid button,.row button,.judge button{border:1px solid #ece8f7;background:#fff;border-radius:18px;padding:13px 7px;color:#5c668d}.category-grid button span{display:block;font-size:22px}.active{border-color:#9da9f6!important;background:linear-gradient(145deg,#f2f3ff,#fff2f8)!important;color:#5269c9!important}.row,.judge,.actions{display:flex;gap:9px;flex-wrap:wrap}.row button,.judge button{flex:1}.judge small{display:block;font-size:10px}.note{font-size:12px;color:#7c7695}textarea,#search{width:100%;border:1px solid #dddaf0;border-radius:14px;background:#fbfaff;padding:13px;color:#4d5270}textarea{min-height:80px}.go{flex:1;border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,#758cf2,#d68ad1);color:#fff;font-weight:700}.secondary{border:1px solid #ddd8ee;background:#fff;color:#7d7997;border-radius:14px;padding:13px}
.cards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.card{text-align:center;width:145px;background:#fff;border:1px solid #e8e3f4;border-radius:18px;padding:9px}.card img{width:100%;height:205px;object-fit:contain;border-radius:7px}.card.rev img{transform:rotate(180deg)}.card b,.card small,.card span{display:block}.card small{color:#a098b1}.card span{font-size:11px;color:#7f87ae}.score{text-align:center;background:linear-gradient(90deg,#fff0f7,#eef1ff);padding:14px;border-radius:15px;margin:16px 0}.score strong{font-size:22px;color:#e181ad}.one{padding:16px;border-radius:18px;background:linear-gradient(135deg,#ffebf6,#efebff);text-align:center;font-weight:700}.caution{background:#fff8fb;color:#9a7387;padding:12px;border-radius:14px;font-size:12px}
.dictionary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.dictcard{border:1px solid #e9e5f2;background:#fff;border-radius:14px;padding:7px;color:#58618a}.dictcard img{width:100%;height:145px;object-fit:contain}.dictcard b,.dictcard small{display:block}.dictcard small{font-size:9px}.version{text-align:center;color:#a09cb6;font-size:11px;margin-top:28px}.version>*{display:block}
.overlay{position:fixed;inset:0;z-index:1500;display:grid;place-items:center;background:radial-gradient(circle,#fff4fb,#efe7ff 58%,#e0f1ff);overflow:hidden}.overlay[hidden]{display:none}.stage{text-align:center;color:#715778;width:min(700px,100vw)}.stage h2{font-family:Georgia,serif;color:#9c6695}.shuffle{position:relative;height:260px;overflow:hidden}.shuffle i{position:absolute;left:50%;top:35px;width:100px;height:160px;margin-left:-50px;border:2px solid #dca7c6;border-radius:10px;background:linear-gradient(135deg,#f7d9e9,#dcd5fa 55%,#cfe9fb);box-shadow:0 10px 28px #88659d40;will-change:transform,opacity}.overlay.playing .shuffle i{animation:shuffle2d .75s ease-in-out 4 both}.shuffle i:nth-child(2){animation-delay:-.12s!important}.shuffle i:nth-child(3){animation-delay:-.24s!important}.shuffle i:nth-child(4){animation-delay:-.36s!important}.shuffle i:nth-child(5){animation-delay:-.48s!important}.shuffle i:nth-child(6){animation-delay:-.60s!important}.shuffle i:nth-child(7){animation-delay:-.72s!important}@keyframes shuffle2d{0%,100%{transform:translateX(-150px) rotate(-16deg);opacity:.55}45%{transform:translateX(110px) translateY(-15px) rotate(13deg);opacity:1}72%{transform:translateX(-25px) rotate(-5deg);opacity:.9}}
@media(max-width:600px){.category-grid{grid-template-columns:repeat(3,1fr)}.panel{padding:15px}.dictionary{grid-template-columns:repeat(3,1fr)}.dictcard img{height:120px}.card{width:128px}.card img{height:180px}.actions{display:grid;grid-template-columns:1fr}.go{width:100%}}
</style>
</head><body>
<header><div class="logo">✦</div><div><h1>My Tarot <small>Gift</small></h1><p>あなたへ贈る、小さなタロット。</p></div><span class="spark">🎁</span></header>
<div class="gift">FOR YOU ♡<b>このタロットを、あなたへ。</b><span>気になる日に、そっとカードを開いてみてね。</span></div>
<nav><button data-view="read" class="active">⌂ ホーム</button><button data-view="dict">◇ カード辞典</button><button data-view="history">◷ 履歴</button></nav>
<main>
<section id="read"><div class="hello"><span>Welcome ♡</span><h2>今日は何を占う？</h2><p>気になることを選んで、カードに聞いてみよう 🌷</p></div>
<div id="cats" class="category-grid"></div>
<div class="panel"><h3>判定スタイル</h3><div class="judge"><button data-j="gentle" class="active">🌷 優しい判定<small>前向きに伝える</small></button><button data-j="authentic">🔮 本格判定<small>カードをそのまま読む</small></button><button data-j="ai">🤖 AI判定<small>GitHub版では準備中</small></button></div><p id="note" class="note">吉凶は変えず、注意点も隠さず、前向きな言葉でお伝えします。</p>
<h3>カード枚数</h3><div class="row"><button data-n="1" class="active">1枚</button><button data-n="3">3枚</button><button data-n="7">7枚</button></div>
<h3>質問 <small>書かなくてもOK</small></h3><textarea id="q" placeholder="例）これからどうしたらいい？"></textarea>
<div class="actions"><button id="go" class="go">♡ 今すぐ占う</button><button id="reset" class="secondary">↺ リセット</button></div></div><div id="result"></div>
</section>
<section id="dict" hidden><div class="panel"><h2>📖 カード辞典</h2><input id="search" placeholder="カード名を検索"><div id="dictionary" class="dictionary"></div></div></section>
<section id="history" hidden><div class="panel"><h2>🕘 鑑定履歴</h2><div id="historyList"></div><button id="clear" class="secondary">履歴をすべて削除</button></div></section>
<div class="version"><b>My Tarot Girls Gift</b><span>GitHub Pages Version 1.15.0</span><small>更新日 2026.09.16</small></div>
</main>
<div id="overlay" class="overlay" hidden><div class="stage"><div>✦</div><h2>カードをシャッフル中…</h2><p>あなたへのメッセージを選んでいるよ ♡</p><div class="shuffle"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
<script>
const majors=['愚者','魔術師','女教皇','女帝','皇帝','法王','恋人','戦車','力','隠者','運命の輪','正義','吊るされた男','死神','節制','悪魔','塔','星','月','太陽','審判','世界'];
const suits=['ワンド','カップ','ソード','ペンタクル'],ranks=['エース','2','3','4','5','6','7','8','9','10','ペイジ','ナイト','クイーン','キング'];
const names=[...majors,...suits.flatMap(s=>ranks.map(r=>s+' '+r))];
const cores=['自由・新しい旅立ち','意志・創造・行動','直感・静かな洞察','豊かさ・育成・受容','秩序・責任・統率','伝統・学び・信頼','選択・結びつき・調和','前進・意志・勝利','内なる強さ・忍耐','内省・探求・導き','転機・循環・好機','公平・判断・責任','視点転換・受容・待つ力','終結・変容・再生','調整・節度・統合','執着・誘惑・束縛','急変・崩壊・解放','希望・癒やし・未来','不安・曖昧さ・無意識','喜び・成功・明快さ','目覚め・再評価・復活','完成・統合・達成'];
const suitCore={ワンド:'情熱・行動・創造性',カップ:'感情・愛情・人間関係',ソード:'思考・決断・葛藤',ペンタクル:'現実・仕事・お金・安定'};
const rankCore={エース:'始まり・可能性','2':'選択・バランス','3':'発展・協力','4':'安定・維持','5':'摩擦・変化','6':'回復・前進','7':'試練・評価','8':'動き・熟練','9':'成熟・あと一歩','10':'完成・責任',ペイジ:'学び・知らせ',ナイト:'行動・追求',クイーン:'受容・成熟',キング:'統率・確立'};
const english=['Fool','Magician','High Priestess','Empress','Emperor','Hierophant','Lovers','Chariot','Strength','Hermit','Wheel of Fortune','Justice','Hanged Man','Death','Temperance','Devil','Tower','Star','Moon','Sun','Judgement','World'];
const suitEn={ワンド:'Wands',カップ:'Cups',ソード:'Swords',ペンタクル:'Pentacles'},rankNum={エース:'01',ペイジ:'11',ナイト:'12',クイーン:'13',キング:'14'};
const categories=['今日の運勢','恋愛','相手の気持ち','学校の悩み','仕事・バイト','人間関係','推し活','自分磨き'],icons=['☀','♡','💬','🎓','💼','👭','★','♢'];
const positions={1:['メッセージ'],3:['過去','現在','未来'],7:['現在','問題・障害','過去の影響','近い未来','本人の気持ち','周囲・相手の影響','最終結果・アドバイス']};
let category=categories[0],judgment='gentle',count=1,cards=[];
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function core(n){let i=majors.indexOf(n);if(i>=0)return cores[i];let [s,r]=n.split(' ');return suitCore[s]+'・'+rankCore[r]}
function imgUrl(n){let i=majors.indexOf(n),f;if(i>=0)f=`RWS1909 - ${String(i).padStart(2,'0')} ${english[i]}.jpeg`;else{let[s,r]=n.split(' ');f=`RWS1909 - ${suitEn[s]} ${rankNum[r]||String(r).padStart(2,'0')}.jpeg`}return 'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(f)}
function draw(){let p=[...names];cards=positions[count].map(pos=>{let i=Math.floor(Math.random()*p.length);return{name:p.splice(i,1)[0],ori:Math.random()<.5?'up':'rev',pos}})}
function score(){return cards.reduce((a,c)=>a+(c.ori==='up'?1:-.6)*(majors.includes(c.name)?1.2:1),0)/cards.length}
function fortune(s){return s>.8?'大吉':s>.35?'吉':s>.05?'中吉':s>-.2?'小吉':s>-.45?'末吉':s>-.8?'凶':'大凶'}
function showShuffle(){return new Promise(r=>{let o=$('#overlay');o.hidden=false;o.classList.remove('playing');void o.offsetWidth;o.classList.add('playing');document.body.style.overflow='hidden';setTimeout(()=>{o.classList.remove('playing');o.hidden=true;document.body.style.overflow='';r()},3000)})}
function render(){let f=fortune(score()),q=$('#q').value.trim(),theme=core(cards[0].name);let ch=cards.map(c=>`<article class="card ${c.ori==='rev'?'rev':''}"><b>${esc(c.pos)}</b><img src="${imgUrl(c.name)}" alt="${esc(c.name)}"><strong>${esc(c.name)}</strong><small>${esc(theme)}</small><span>${c.ori==='up'?'正位置':'逆位置'}</span></article>`).join('');
let one=judgment==='gentle'?'カードの結果をヒントに、無理のない一歩から進んでみてね。':'良い意味も厳しい意味も含め、今の状況を見直す材料にしてください。';
let msg=`${cards.map(c=>`${c.pos}の「${c.name}」は${c.ori==='up'?'正位置':'逆位置'}`).join('、')}。中心テーマは「${theme}」です。`;
$('#result').innerHTML=`<div class="panel"><p style="text-align:center">A MESSAGE FOR YOU</p><h2 style="text-align:center">カードからのメッセージ</h2><div class="cards">${ch}</div><div class="score">今日の吉凶 <strong>${f}</strong></div><div class="one">${one}</div><h3>💐 メッセージ</h3><p>${esc(msg)}</p><h3>♡ 今回のポイント</h3><p>${esc(q?`「${q}」について、${theme}を意識して状況を整理してみて。`:`${theme}を今日の判断のヒントにしてみて。`)}</p><h3>🌱 これからのヒント</h3><p>結論を急がず、今日できる小さな行動を一つ選んでみてください。</p><div class="caution">占いは未来を確定するものではなく、気持ちを整理するためのヒントです。</div></div>`;
let h=JSON.parse(localStorage.getItem('myTarotGiftHistory')||'[]');h.unshift({date:new Date().toLocaleString('ja-JP'),category,fortune:f,q,msg});localStorage.setItem('myTarotGiftHistory',JSON.stringify(h.slice(0,50)));$('#result').scrollIntoView({behavior:'smooth'})}
$('#cats').innerHTML=categories.map((x,i)=>`<button data-cat="${x}" class="${i===0?'active':''}"><span>${icons[i]}</span>${x}</button>`).join('');
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{if(b.dataset.j==='ai'){alert('AI判定はGitHub Pages版では準備中です。現在は「優しい判定」または「本格判定」をご利用ください。');return}judgment=b.dataset.j;document.querySelectorAll('[data-j]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#note').textContent=judgment==='gentle'?'吉凶は変えず、注意点も隠さず、前向きな言葉でお伝えします。':'良い意味も厳しい意味も、カードの象徴に沿って読みます。'});
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{count=+b.dataset.n;document.querySelectorAll('[data-n]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
$('#go').onclick=async()=>{await showShuffle();draw();render()};$('#reset').onclick=()=>location.reload();
function dict(){let q=$('#search').value.trim();$('#dictionary').innerHTML=names.filter(n=>!q||n.includes(q)).map(n=>`<button class="dictcard"><img src="${imgUrl(n)}" alt="${esc(n)}"><b>${esc(n)}</b><small>${esc(core(n))}</small></button>`).join('')}dict();$('#search').oninput=dict;
function hist(){let h=JSON.parse(localStorage.getItem('myTarotGiftHistory')||'[]');$('#historyList').innerHTML=h.length?h.map(x=>`<details><summary>${esc(x.date)}　${esc(x.category)}　${esc(x.fortune)}</summary><p>${esc(x.q||'質問なし')}</p><p>${esc(x.msg)}</p></details>`).join(''):'まだ履歴はないよ。'}$('#clear').onclick=()=>{localStorage.removeItem('myTarotGiftHistory');hist()};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('main>section').forEach(s=>s.hidden=true);$('#'+b.dataset.view).hidden=false;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view==='history')hist()});
</script></body></html>
